<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altea Illotto — Gestione Disponibilità Visite</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fcf9f2;
            --text: #2c2c2c;
            --text-light: #6b6b6b;
            --accent: #8C2D32;
            --accent-hover: #6B1F25;
            --gold: #EAD3A2;
            --border: #e0d6c8;
            --max-w: 800px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-serif: 'Altea Illotto', 'Playfair Display', Georgia, serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            padding: 40px 20px;
        }
        .container { max-width: var(--max-w); margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-family: var(--font-serif); color: var(--accent); font-size: 2.2rem; margin-bottom: 8px; }
        p.sub { color: var(--text-light); }

        .card {
            background: #fffcf7; border: 1px solid var(--border);
            border-radius: 8px; padding: 32px; margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,.03);
        }

        /* Login */
        .login-box { max-width: 400px; margin: 60px auto; text-align: center; }
        .login-box input {
            width: 100%; padding: 14px; border: 1px solid var(--border);
            border-radius: 6px; margin: 16px 0; font-size: 1rem;
        }
        
        .btn {
            background: var(--accent); color: #fff; padding: 12px 24px;
            border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
            font-size: 1rem; transition: .2s; width: 100%;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline {
            background: transparent; color: var(--accent); border: 1px solid var(--accent);
        }
        .btn-outline:hover { background: var(--accent); color: #fff; }

        /* Calendario */
        .cal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .cal-header h2 { font-family: var(--font-serif); color: var(--accent); }
        .cal-nav button {
            background: var(--accent); color: #fff; border: none;
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            font-weight: bold; font-size: 1.1rem;
        }
        .cal-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
        }
        .cal-weekday {
            text-align: center; font-weight: 600; color: var(--text-light);
            font-size: .85rem; padding-bottom: 8px;
        }
        .cal-day {
            aspect-ratio: 1; border: 1px solid var(--border); border-radius: 6px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; user-select: none;
            background: #fff; transition: .15s; position: relative;
        }
        .cal-day.empty { border: none; background: transparent; cursor: default; }
        .cal-day.active {
            background: #e6f4ea; border-color: #34a853; color: #137333; font-weight: 600;
        }
        .cal-day.active::after {
            content: '✓'; position: absolute; bottom: 2px; font-size: 0.75rem;
        }
        .cal-day.inactive {
            background: #fce8e6; border-color: #ea4335; color: #c5221f; opacity: 0.6;
        }
        .cal-day.past {
            background: #f1f3f4; border-color: #dadce0; color: #9aa0a6; cursor: not-allowed; opacity: 0.5;
        }
        
        .status-bar {
            margin-top: 24px; padding: 12px 16px; border-radius: 6px;
            font-size: .9rem; display: none; text-align: center;
        }
        .status-bar.success { background: #e6f4ea; color: #137333; display: block; }
        .status-bar.error { background: #fce8e6; color: #c5221f; display: block; }
        .status-bar.info { background: #e8f0fe; color: #1a73e8; display: block; }

        .controls {
            display: flex; gap: 16px; margin-top: 24px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Altea Illotto</h1>
        <p class="sub">Gestione Disponibilità Visite e Degustazioni</p>
    </header>

    <!-- SCHERMATA LOGIN -->
    <div id="loginSection" class="card login-box">
        <h3>Accesso Riservato</h3>
        <p style="font-size: .85rem; color: var(--text-light); margin-top: 6px;">
            Inserisci il Token di Accesso per modificare le disponibilità.
        </p>
        <input type="password" id="tokenInput" placeholder="Inserisci Token GitHub">
        <button class="btn" id="loginBtn">Accedi alla Gestione</button>
        <div id="loginStatus" class="status-bar" style="margin-top: 16px;"></div>
    </div>

    <!-- SCHERMATA PANNELLO ADMIN -->
    <div id="adminSection" class="hidden">
        <div class="card">
            <div class="cal-header">
                <h2 id="calMonthYear">Mese Anno</h2>
                <div class="cal-nav">
                    <button id="prevMonthBtn">&lt;</button>
                    <button id="nextMonthBtn">&gt;</button>
                </div>
            </div>

            <p style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 16px; text-align: center;">
                Clicca su un giorno per attivare (verde <span style="color: #34a853;">✓</span>) o disattivare (rosso <span style="color: #ea4335;">✗</span>) la disponibilità.
            </p>

            <div class="cal-grid">
                <div class="cal-weekday">Lun</div>
                <div class="cal-weekday">Mar</div>
                <div class="cal-weekday">Mer</div>
                <div class="cal-weekday">Gio</div>
                <div class="cal-weekday">Ven</div>
                <div class="cal-weekday">Sab</div>
                <div class="cal-weekday">Dom</div>
            </div>
            
            <div class="cal-grid" id="calDays" style="margin-top: 8px;"></div>

            <div id="statusBar" class="status-bar"></div>

            <div class="controls">
                <button class="btn" id="saveBtn">💾 Salva Modifiche sul Sito</button>
                <button class="btn btn-outline" id="logoutBtn">Esci</button>
            </div>
        </div>
    </div>
</div>

<script>
    const REPO_OWNER = 'tueisis';
    const REPO_NAME = 'alteaillotto';
    const FILE_PATH = 'date-disponibili.json';

    let token = localStorage.getItem('gh_token') || '';
    let fileSha = '';
    let dateDisponibiliSet = new Set();
    
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    const nomiMesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

    // Inizializzazione
    if (token) {
        caricaDati();
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
        const inputVal = document.getElementById('tokenInput').value.trim();
        if (!inputVal) return showStatus('loginStatus', 'Inserisci un token valido.', 'error');
        token = inputVal;
        localStorage.setItem('gh_token', token);
        caricaDati();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('gh_token');
        token = '';
        document.getElementById('adminSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('tokenInput').value = '';
    });

    async function caricaDati() {
        showStatus('loginStatus', 'Verifica credenziali e caricamento...', 'info');
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: { 'Authorization': `token ${token}` }
            });

            if (!res.ok) throw new Error('Token non valido o permessi insufficienti');

            const json = await res.json();
            fileSha = json.sha;
            
            // Decodifica il contenuto base64 (gestione utf-8)
            const contentDecoded = decodeURIComponent(escape(atob(json.content)));
            const data = JSON.parse(contentDecoded);

            dateDisponibiliSet = new Set(data.dateDisponibili || []);

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            
            renderCalendario();
            showStatus('statusBar', 'Date caricate con successo.', 'success');
        } catch (err) {
            localStorage.removeItem('gh_token');
            token = '';
            showStatus('loginStatus', 'Errore: ' + err.message, 'error');
        }
    }

    function renderCalendario() {
        document.getElementById('calMonthYear').textContent = `${nomiMesi[currentMonth]} ${currentYear}`;
        const container = document.getElementById('calDays');
        container.innerHTML = '';

        const primoGiorno = new Date(currentYear, currentMonth, 1);
        const ultimoGiorno = new Date(currentYear, currentMonth + 1, 0).getDate();
        let offset = primoGiorno.getDay() - 1;
        if (offset < 0) offset = 6;

        for (let i = 0; i < offset; i++) {
            const empty = document.createElement('div');
            empty.className = 'cal-day empty';
            container.appendChild(empty);
        }

        const oggi = new Date();
        oggi.setHours(0,0,0,0);

        for (let day = 1; day <= ultimoGiorno; day++) {
            const dateObj = new Date(currentYear, currentMonth, day);
            const dateStr = formatDate(dateObj);
            
            const cell = document.createElement('div');
            cell.className = 'cal-day';
            cell.textContent = day;

            if (dateObj < oggi) {
                cell.classList.add('past');
            } else {
                if (dateDisponibiliSet.has(dateStr)) {
                    cell.classList.add('active');
                } else {
                    cell.classList.add('inactive');
                }

                cell.addEventListener('click', () => {
                    if (dateDisponibiliSet.has(dateStr)) {
                        dateDisponibiliSet.delete(dateStr);
                        cell.classList.remove('active');
                        cell.classList.add('inactive');
                    } else {
                        dateDisponibiliSet.add(dateStr);
                        cell.classList.remove('inactive');
                        cell.classList.add('active');
                    }
                });
            }

            container.appendChild(cell);
        }
    }

    document.getElementById('prevMonthBtn').addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendario();
    });

    document.getElementById('nextMonthBtn').addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendario();
    });

    // Salva su GitHub via API
    document.getElementById('saveBtn').addEventListener('click', async () => {
        showStatus('statusBar', 'Salvataggio in corso...', 'info');

        const arraySorted = Array.from(dateDisponibiliSet).sort();
        const payloadObj = {
            dateDisponibili: arraySorted,
            ultimoAggiornamento: new Date().toISOString().split('T')[0]
        };

        const jsonString = JSON.stringify(payloadObj, null, 2);
        const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Aggiornamento disponibilità date via Admin Panel',
                    content: contentEncoded,
                    sha: fileSha
                })
            });

            if (!res.ok) throw new Error('Errore durante il salvataggio su GitHub');

            const resData = await res.json();
            fileSha = resData.content.sha;

            showStatus('statusBar', ' Modifiche salvate sul sito con successo! (Aggiornamento live entro 1-2 minuti)', 'success');
        } catch (err) {
            showStatus('statusBar', 'Errore salvataggio: ' + err.message, 'error');
        }
    });

    function formatDate(d) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function showStatus(id, msg, type) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.className = `status-bar ${type}`;
    }
</script>
</body>
</html>
